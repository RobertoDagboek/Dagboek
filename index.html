<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Dagboek</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dagboek">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="./app.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body class="no-tabs">

<!-- ============ LOCK: username + PIN ============ -->
<section id="screen-lock" class="lockscreen">
  <div class="lockcard">
    <h1 class="lock-brand">Dagboek</h1>
    <p class="lock-greet" id="pin-greet"></p>

    <div class="lock-user" id="pin-user-row">
      <input id="pin-user" type="text" autocomplete="username" autocapitalize="none"
             spellcheck="false" placeholder="Username">
    </div>

    <p class="lock-prompt" id="pin-prompt"></p>
    <div class="pin-dots" id="pin-dots" aria-hidden="true"></div>
    <p class="lock-msg" id="pin-msg"></p>

    <div class="keypad">
      <button class="key" data-k="1" type="button">1</button>
      <button class="key" data-k="2" type="button">2</button>
      <button class="key" data-k="3" type="button">3</button>
      <button class="key" data-k="4" type="button">4</button>
      <button class="key" data-k="5" type="button">5</button>
      <button class="key" data-k="6" type="button">6</button>
      <button class="key" data-k="7" type="button">7</button>
      <button class="key" data-k="8" type="button">8</button>
      <button class="key" data-k="9" type="button">9</button>
      <button class="key key-alt" data-k="del" type="button">&#9003;</button>
      <button class="key" data-k="0" type="button">0</button>
      <button class="key key-go" data-k="ok" type="button">&#10003;</button>
    </div>

    <button id="bioBtn" class="ghost bio-btn" type="button" hidden>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 10v3a4 4 0 0 0 8 0v-3M12 8v6"/></svg>
      Unlock with Face ID
    </button>

    <div class="lock-links">
      <button id="pin-newuser" class="ghost" type="button">New account</button>
      <button id="pin-switch" class="link" type="button">Different name</button>
    </div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app-shell" hidden>
  <div class="navheader">
    <div class="navheader-text">
      <div class="navtitle" id="navTitle">Today</div>
      <div class="navsub" id="navSub"></div>
    </div>
    <div class="navactions">
      <button class="gear-btn" id="gearBtn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <div class="wrap" id="screenContent"></div>

  <button class="fab" id="fabAdd" type="button" aria-label="Add"></button>
  <div class="tabbar" id="tabbar"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<div id="viewer" class="viewer" hidden>
  <button id="viewer-close" class="viewer-x" type="button" aria-label="Close">&times;</button>
  <div id="viewer-body" class="viewer-body"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
